; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ===============================================
; COMMON SETTINGS FOR ALL ENVIRONMENTS
; ===============================================
; The env is the BUILD FAMILY (SoC, flash/PSRAM class, toolchain, partitions, sdkconfig).
; The board is selected by YORADIO_BOARD in src/myoptions.h, not by the env (D1).
; Env — это СЕМЕЙСТВО СБОРКИ (SoC, класс flash/PSRAM, тулчейн, разделы, sdkconfig).
; Плату выбирает YORADIO_BOARD в src/myoptions.h, а не env (D1).
[platformio]
default_envs = S3_N16R8

[env]
framework = arduino
; 55.03.312: ESP Arduino 3.3.12 / ESP-IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312/platform-espressif32.zip
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; Factory text + Tabler icon TTF: YoRadio-wide production assets, not board-specific.
; Factory-текст + Tabler-иконки: общие production-ассеты, не привязка к плате.
board_build.embed_files =
	src/src/lvgl_ui/fonts/yoradio_factory_font.ttf
	src/src/lvgl_ui/fonts/yoradio_tabler.ttf
upload_speed = 921600
upload_protocol = esptool
lib_deps =
	; ArduinoJson 7.x compatible range (no patch pin; exclude major 8)
	bblanchon/ArduinoJson@^7.0.0
	; LVGL 9.5.0 (BASE-LVGL9-MIGRATION EXEC-01: immutable exact pin, not ^/~)
	lvgl/lvgl@9.5.0
; tool-mkspiffs removed: LittleFS tooling is built into the platform (Stage 1)

; Common build flags / Общие флаги сборки для всех плат
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-DAUDIOTASK_CORE=1
	-DCONFIG_SPIRAM_SUPPORT=1
	-DARDUINO_USB_MODE=1
	; LVGL config discovery / Обнаружение lv_conf.h для LVGL
	-I src/src/lvgl_ui
	-DLV_CONF_INCLUDE_SIMPLE
	-DLVGL_DEBUG_STACK
	; AsyncTCP parameters for custom LwIP libraries compatibility
	; AsyncTCP параметры для работы с кастомными LwIP библиотеками
	-DXQUEUE_SIZE=256
	-DMAX_ASYNC_TCP_SLOTS=128

; ===============================================
; BOARD CONFIGURATIONS / Конфигурации плат
; ===============================================

; --- ESP32-S3 N16R8 (16MB Flash + 8MB PSRAM): shared module facts, not a buildable env ---
; --- ESP32-S3 N16R8 (16 МБ flash + 8 МБ PSRAM): общие факты модуля, не самостоятельный env ---
[n16r8_base]
board = esp32s3_n16r8
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = partition_16MB_ota_spiffs.csv

; ===============================================
; DEVICE ENVIRONMENTS / Окружения устройств
; ===============================================

; --- S3_N16R8: ESP32-S3 N16R8, mixed Arduino + ESP-IDF (build family) ---
; Boards on this family: ESP32-4848S040 (ST7701 RGB 480x480). Select with YORADIO_BOARD.
; S01-1: mixed Arduino + ESP-IDF. S01-2: platform pin 55.03.312 (Arduino 3.3.12, ESP-IDF 5.5.5).
; S07_bis-6: renamed from env:4848S040; nothing in the build depends on the env name.
; Платы этого семейства: ESP32-4848S040 (ST7701 RGB 480x480). Выбор — YORADIO_BOARD.
; S07_bis-6: переименован из env:4848S040; сборка не зависит от имени env.
[env:S3_N16R8]
extends = n16r8_base
framework = arduino, espidf
board_build.partitions = partition_16MB_ota_largefs.csv
; FATFS overlay for the Storage Owner. Owner itself: option YORADIO_STORAGE_OWNER
; in src/CMakeLists.txt (ON by default; add -DYORADIO_STORAGE_OWNER=OFF here to drop it).
; Overlay FATFS для Storage Owner. Сам Owner — option YORADIO_STORAGE_OWNER в
; src/CMakeLists.txt (по умолчанию ON; -DYORADIO_STORAGE_OWNER=OFF здесь отключает).
board_build.cmake_extra_args =
	-DSDKCONFIG_DEFAULTS=sdkconfig.defaults;sdkconfig.defaults.storage_owner
; Mixed mode embeds the TTF files from src/CMakeLists.txt. The common
; board_build.embed_files path writes the same .S with different symbol names
; and would replace that file. Arduino-only envs keep the common list.
; В mixed TTF вшивает src/CMakeLists.txt. Общий embed_files пишет тот же .S
; с другими именами символов и затирает файл. Arduino-only список общий.
board_build.embed_files =
; Board extra_flags still pass CDC_ON_BOOT=1. This env's product policy is off.
; Drop the board value so the later -D=0 is the only definition. CPU 240 MHz
; comes from sdkconfig, not a second -D of the deprecated alias.
; Плата всё ещё передаёт CDC_ON_BOOT=1. Для этого env политика — выкл.
; Убираем значение платы, чтобы остался один -D=0. 240 МГц берётся из sdkconfig,
; без второго -D устаревшего алиаса.
build_unflags =
	-DARDUINO_USB_CDC_ON_BOOT=1
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=0
	; libgcc objects omit .note.GNU-stack. Mark the image non-executable stack
	; and do not warn about those toolchain objects.
	; Объекты libgcc без .note.GNU-stack. Образ помечается как noexecstack,
	; предупреждение про объекты тулчейна не печатается.
	-Wl,-z,noexecstack
	-Wl,--no-warn-execstack
	; Mixed-build TLS bridge: DYNAMIC_BUFFER needs these 12 wraps on the final
	; ELF link. YORADIO_IDF_C1_CONFIG is defined in src/CMakeLists.txt as part of
	; the component's IDF configuration (-D flags here do reach app TUs, N11).
	; Mixed TLS-мост: эти 12 wraps нужны на финальной линковке ELF.
	; YORADIO_IDF_C1_CONFIG задан в src/CMakeLists.txt как часть IDF-конфигурации
	; компонента (флаги -D отсюда до TU приложения доходят, N11).
	-Wl,--wrap=mbedtls_ssl_close_notify
	-Wl,--wrap=mbedtls_ssl_free
	-Wl,--wrap=mbedtls_ssl_handshake_client_step
	-Wl,--wrap=mbedtls_ssl_handshake_server_step
	-Wl,--wrap=mbedtls_ssl_read
	-Wl,--wrap=mbedtls_ssl_send_alert_message
	-Wl,--wrap=mbedtls_ssl_session_reset
	-Wl,--wrap=mbedtls_ssl_setup
	-Wl,--wrap=mbedtls_ssl_tls13_handshake_client_step
	-Wl,--wrap=mbedtls_ssl_tls13_handshake_server_step
	-Wl,--wrap=mbedtls_ssl_write
	-Wl,--wrap=mbedtls_ssl_write_client_hello
	-DSM_DIAG_PERSIST=0
	-DYORADIO_LVGL_TOUCH_DEBUG=0
	; S3 production LVGL TLSF pool: 384 KiB in PSRAM (board resource, not a font selector).
	; 256 KiB left ~15 KiB headroom at the Weather->Main peak (both page trees resident);
	; 384 KiB restores margin while PSRAM heap keeps >4 MiB contiguous free.
	; 256 KiB оставляли ~15 KiB запаса на пике Weather->Main (оба дерева живы);
	; 384 KiB возвращают запас, PSRAM-куча при этом сохраняет >4 MiB непрерывно.
	-DYORADIO_LVGL_POOL_IN_PSRAM=1
	-DYORADIO_LVGL_POOL_SIZE_KIB=384
