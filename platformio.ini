; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; ===============================================
; COMMON SETTINGS FOR ALL ENVIRONMENTS
; ===============================================
[env]
framework = arduino
; 55.03.311: ESP Arduino 3.3.11 / ESP-IDF 5.5.5
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
; YoRadio build helper. Selects the project-local ESP-IDF library overlay
; (library!/esp-idf-5.5.5/<target>/) and its linker policy automatically.
; PlatformIO runs it on every build - never invoke it by hand.
; NOTE: any [env:*] that declares its own extra_scripts must include
; ${env.extra_scripts}, otherwise that env silently builds stock.
extra_scripts =
	pre:yoradio_build.py
	pre:font_source_build.py
upload_speed = 921600
upload_protocol = esptool
lib_deps =
	; ArduinoJson 7.x compatible range (no patch pin; exclude major 8)
	bblanchon/ArduinoJson@^7.0.0
	; LVGL 9.5.0 (BASE-LVGL9-MIGRATION EXEC-01: immutable exact pin, not ^/~)
	lvgl/lvgl@9.5.0
; tool-mkspiffs removed: LittleFS tooling is built into the platform (Stage 1)

; Common build flags / Общие флаги сборки для всех плат
build_flags = 
	-DCORE_DEBUG_LEVEL=0
	-DBOARD_HAS_PSRAM
	-DARDUINO_RUNNING_CORE=1
	-DARDUINO_EVENT_RUNNING_CORE=1
	-DAUDIOTASK_CORE=1
	-DCONFIG_SPIRAM_SUPPORT=1
	-DARDUINO_USB_MODE=1
	-DCONFIG_ESP32S3_DEFAULT_CPU_FREQ_240=1
	; LVGL config discovery / Обнаружение lv_conf.h для LVGL
	-I src/src/lvgl_ui
	-DLV_CONF_INCLUDE_SIMPLE
	-DLVGL_DEBUG_STACK
	; AsyncTCP parameters for custom LwIP libraries compatibility
	; AsyncTCP параметры для работы с кастомными LwIP библиотеками
	-DXQUEUE_SIZE=256
	-DMAX_ASYNC_TCP_SLOTS=128

; ===============================================
; BOARD CONFIGURATIONS / Конфигурации плат
; ===============================================

; --- ESP32-S3 N16R8 (16MB Flash + 8MB PSRAM) ---
[env:N16R8_base]
board = esp32s3_n16r8
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.filesystem = littlefs
board_build.partitions = partition_16MB_ota_spiffs.csv

; --- ESP32-S3 N8R4 (8MB Flash + 4MB PSRAM) - Future boards ---
; Uncomment when adding N8R4 boards / Раскомментировать при добавлении плат N8R4
;[env:N8R4_base]
;board = esp32s3_n4r8
;board_upload.flash_size = 8MB
;board_build.arduino.memory_type = qio_opi
;board_build.filesystem = littlefs
;board_build.partitions = minimal_spiffs.csv

; ===============================================
; DEVICE ENVIRONMENTS / Окружения устройств
; ===============================================

; --- LEGACY ENVIRONMENT (for reference) ---
[env:yoradio-esp32s3]
extends = env:N16R8_base
build_flags = 
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=1

; --- 4848S040 (ST7701S RGB, 480x480, 4.0") ---
; Public beta / production target. Other board envs removed with unsupported profiles.
; Публичная beta / production-таргет. Прочие env удалены вместе с неподдерживаемыми профилями.
[env:4848S040]
extends = env:N16R8_base
board_build.partitions = partition_16MB_ota_largefs.csv
; Production factory text font: change this one raw-TTF path, then rebuild.
custom_text_ttf_source = src/src/lvgl_ui/font_sources/yoradio_factory_font.ttf
; Canonical full Tabler is tooling-only; the used-codepoint manifest drives the subset.
custom_tabler_ttf_source = tools/fonts/tabler-icons.ttf
custom_tabler_codepoint_manifest = src/src/lvgl_ui/font_sources/yoradio_tabler_codepoints.txt
build_flags =
	${env.build_flags}
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DSM_DIAG_PERSIST=0
	-DYORADIO_LVGL_TOUCH_DEBUG=0
	; Production text+icon backend: TinyTTF P64 text / P8 icons in a 256 KiB PSRAM LVGL pool.
	-DYORADIO_LVGL_POOL_IN_PSRAM=1
	-DYORADIO_LVGL_POOL_SIZE_KIB=256
	-DYORADIO_TEXT_GLYPH_CACHE=64
	-DYORADIO_ICON_GLYPH_CACHE=8

; ===============================================
; FUTURE N8R4 BOARDS EXAMPLE / Пример будущих плат N8R4
; ===============================================
; Uncomment and modify when adding new boards with less memory
; Раскомментировать и изменить при добавлении новых плат с меньшей памятью
;
;[env:YourBoard_N8R4]
;extends = env:N8R4_base
;build_flags = 
;	${env.build_flags}
;	-DARDUINO_USB_CDC_ON_BOOT=1
